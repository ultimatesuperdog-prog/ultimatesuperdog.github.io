<!DOCTYPE html>
<html>
<head>
                <style>/* =========================
   基本
========================= */

*{
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    margin:0;

    background:
        radial-gradient(
            circle at top,
            #0c0012,
            #440130
        );

    color:#ddd;

    font-family:
        "Yu Gothic",
        sans-serif;

    overflow-x:hidden;
}

/* =========================
   タイトル
========================= */

p{
    text-align:center;

    padding:20px 10px;

    font-size:32px;

    letter-spacing:4px;

    color:#f5dfff;

    text-shadow:
        0 0 10px #8800ff,
        0 0 20px #ff4fd8;
}

/* =========================
   ギャラリー
========================= */

.gallery{

    width:90%;

    max-width:1200px;

    margin:0 auto 50px;

    display:grid;

    grid-template-columns:
        repeat(
            auto-fill,
            minmax(260px,1fr)
        );

    gap:20px;
}

.photo-box{

    position:relative;

    height:260px;

    overflow:hidden;

    border:2px solid #222;

    border-radius:12px;

    background:#000;

    cursor:pointer;

    box-shadow:
        0 0 15px rgba(
            120,0,255,.4
        );

    transition:
        .3s;
}

.photo-box:hover{

    transform:
        scale(1.03);

    box-shadow:
        0 0 25px rgba(
            180,0,255,.7
        );
}

.photo-box img{

    width:100%;
    height:100%;

    object-fit:cover;

    transition:
        .4s;

    filter:
        brightness(70%)
        contrast(120%)
        saturate(130%);
}

.photo-box:hover img{

    filter:
        brightness(100%)
        contrast(140%)
        saturate(150%);
}

/* =========================
   ソートボタン
========================= */

.sort-button{

    position:fixed;

    top:15px;
    left:15px;

    z-index:500;

    border:none;

    border-radius:999px;

    padding:10px 16px;

    cursor:pointer;

    color:white;

    background:
        rgba(
            120,0,255,.75
        );

    backdrop-filter:
        blur(10px);

    box-shadow:
        0 0 15px rgba(
            255,0,255,.5
        );

    transition:
        .25s;
}

.sort-button:hover{

    transform:
        scale(1.05);

    background:
        rgba(
            180,0,255,.9
        );
}

/* =========================
   ライトボックス
========================= */

.lightbox{

    position:fixed;

    inset:0;

    display:flex;

    justify-content:center;
    align-items:center;

    padding:80px;

    background:
        rgba(
            0,0,0,.95
        );

    opacity:0;

    visibility:hidden;

    transition:
        .3s;

    z-index:9999;
}

.lightbox.active{

    opacity:1;

    visibility:visible;
}

.lightbox img{

    max-width:95vw;
    max-height:90vh;

    object-fit:contain;

    transform:
        scale(.95);

    transition:
        .25s;
}

.lightbox.active img{

    transform:
        scale(1);
}

/* =========================
   閉じるボタン
========================= */

.lightbox-close{

    position:fixed;

    top:15px;
    right:20px;

    width:55px;
    height:55px;

    border:none;

    border-radius:50%;

    color:white;

    font-size:38px;

    background:
        rgba(
            0,0,0,.7
        );

    cursor:pointer;

    z-index:10001;
}

/* =========================
   前後ボタン
========================= */

.nav-btn{

    position:fixed;

    top:50%;

    transform:
        translateY(-50%);

    width:60px;
    height:60px;

    border:none;

    border-radius:50%;

    font-size:30px;

    color:white;

    background:
        rgba(
            0,0,0,.7
        );

    cursor:pointer;

    z-index:10001;

    transition:
        .2s;
}

.nav-btn:hover{

    background:
        rgba(
            170,0,255,.8
        );
}

.prev-btn{
    left:20px;
}

.next-btn{
    right:20px;
}

/* =========================
   枚数表示
========================= */

.image-counter{

    position:fixed;

    bottom:20px;

    left:50%;

    transform:
        translateX(-50%);

    padding:8px 15px;

    border-radius:999px;

    background:
        rgba(
            0,0,0,.5
        );

    color:white;

    font-size:14px;

    z-index:10001;
}

/* =========================
   スライドアニメ
========================= */

.slide-left{
    animation:
        slideLeft .25s ease;
}

.slide-right{
    animation:
        slideRight .25s ease;
}

@keyframes slideLeft{

    from{
        opacity:0;

        transform:
            translateX(80px)
            scale(.95);
    }

    to{
        opacity:1;

        transform:
            translateX(0)
            scale(1);
    }
}

@keyframes slideRight{

    from{
        opacity:0;

        transform:
            translateX(-80px)
            scale(.95);
    }

    to{
        opacity:1;

        transform:
            translateX(0)
            scale(1);
    }
}

/* =========================
   シャボン玉
========================= */

#bubbles{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:-1;
}

.bubble{

    position:absolute;

    bottom:-120px;

    border-radius:50%;

    opacity:.25;

    filter:
        blur(2px);

    animation:
        floatUp linear forwards;
}

@keyframes floatUp{

    0%{

        transform:
            translateY(0)
            translateX(0)
            scale(.7);

        opacity:0;

    }

    15%{
        opacity:.35;
    }

    70%{
        opacity:.25;
    }

    100%{

        transform:
            translateY(-120vh)
            translateX(var(--drift))
            scale(1.4);

        opacity:0;
    }
}

/* =========================
   ローダー
========================= */

.loader{

    position:fixed;

    inset:0;

    display:flex;

    flex-direction:column;

    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at top,
            #0c0012,
            #9d0770
        );

    z-index:999999;

    opacity:1;

    transition:
        opacity 1.2s ease,
        visibility 1.2s ease;
}

.loader.hidden{

    opacity:0;

    visibility:hidden;
}

.loader-heart{

    font-size:80px;

    color:#ff8ceb;

    text-shadow:
        0 0 20px #ff6cf5,
        0 0 50px #c373ff;

    animation:
        heartbeat 1.5s infinite;
}

.loader-text{

    margin-top:20px;

    color:white;

    letter-spacing:4px;
}

#loaderCounter{

    margin-top:10px;

    color:#ffe9ff;

    font-size:18px;

    letter-spacing:2px;
}

.loader.hidden .loader-heart,
.loader.hidden .loader-text,
.loader.hidden #loaderCounter{

    opacity:0;

    transform:
        translateY(-15px);
}

@keyframes heartbeat{

    0%{
        transform:scale(1);
    }

    30%{
        transform:scale(1.15);
    }

    50%{
        transform:scale(.95);
    }

    100%{
        transform:scale(1);
    }
}

/* =========================
   スマホ
========================= */

@media(max-width:600px){

    p{
        font-size:20px;
    }

    .gallery{

        width:95%;

        grid-template-columns:
            repeat(
                2,
                1fr
            );

        gap:10px;
    }

    .photo-box{

        height:180px;
    }

    .nav-btn{

        width:48px;
        height:48px;

        font-size:24px;
    }

    .prev-btn{
        left:8px;
    }

    .next-btn{
        right:8px;
    }

}
/* =========================
   ページ出現アニメーション
========================= */

body.loading header,
body.loading .gallery,
body.loading .sort-button{

    opacity:0;

    transform:
        translateY(20px);

}

header,
.gallery,
.sort-button{

    opacity:1;

    transform:
        translateY(0);

    transition:
        opacity 1s ease,
        transform 1s ease;

}

body.loaded header{

    transition-delay:0s;
}

body.loaded .sort-button{

    transition-delay:.15s;
}

body.loaded .gallery{

    transition-delay:.3s;
}
.photo-box{

    opacity:1;

    transform:translateY(0);

    will-change:
        opacity,
        transform;
}</style>

        document.addEventListener('click', function(event) {
            var link = event.target.closest && event.target.closest('a[href]');

            var href = (link.getAttribute('href') || '').trim();
            if (href.charAt(0) === '#') {
                event.preventDefault();
                var fragment = href.slice(1);
                if (!fragment) {
                    window.scrollTo(0, 0);
                    return;
                }
                try { fragment = decodeURIComponent(fragment); } catch (error) {}

                window.open(href, '_blank', 'noopener,noreferrer');
                return;
            }

3-40.039_1440x2560.png"></div><div class="photo-box" style="opacity: 1; transform: translateY(0px); transition: opacity 0.6s, transform 0.6s;"><img src="https://raw.githubusercontent.com/ultimatesuperdog-prog/ultimatesuperdog.github.io/main/photo/VRChat_2026-10-17_11-07-17.950_1440x2560.png"></div></div>

    <!-- ライトボックス -->
    <div id="lightbox" class="lightbox">

        <!-- 閉じる -->
        <button id="lightboxClose" class="lightbox-close" aria-label="閉じる">
            ×
        </button>

        <!-- 前へ -->
        <button id="prevBtn" class="nav-btn prev-btn" aria-label="前の画像">
            ←
        </button>

        <!-- 画像 -->
        <img id="lightboxImage" alt="拡大画像">

        <!-- 次へ -->
        <button id="nextBtn" class="nav-btn next-btn" aria-label="次の画像">
            →
        </button>

        <!-- 枚数表示 -->
        <div id="imageCounter" class="image-counter">
            1 / 1
        </div>

    </div>



                <script>/* =========================
   要素取得
========================= */

const loader =
    document.getElementById("loader");

const loaderCounter =
    document.getElementById(
        "loaderCounter"
    );

const gallery =
    document.getElementById(
        "gallery"
    );

const lightbox =
    document.getElementById(
        "lightbox"
    );

const lightboxImage =
    document.getElementById(
        "lightboxImage"
    );

const lightboxClose =
    document.getElementById(
        "lightboxClose"
    );

const prevBtn =
    document.getElementById(
        "prevBtn"
    );

const nextBtn =
    document.getElementById(
        "nextBtn"
    );

const sortButton =
    document.getElementById(
        "sortButton"
    );

const imageCounter =
    document.getElementById(
        "imageCounter"
    );

const bubbleArea =
    document.getElementById(
        "bubbles"
    );

/* =========================
   状態管理
========================= */

let photoList = [];

let currentIndex = 0;

/*
 false = 古い順
 true  = 新しい順
*/
let newestFirst = false;

let touchStartX = 0;

/* =========================
   GitHub取得
========================= */

async function loadPhotos(){

    try{

        const response =
            await fetch(
                "https://api.github.com/repos/ultimatesuperdog-prog/ultimatesuperdog.github.io/contents/photo"
            );

        const files =
            await response.json();

        photoList =
            files.filter(
                file =>
                    file.type ===
                    "file" &&
                    /\.(jpg|jpeg|png|gif|webp)$/i
                    .test(file.name)
            );

        sortPhotos();

        await preloadAllImages();

        return true;

    }catch(error){

        console.error(error);

        gallery.innerHTML =
            "<p>画像取得失敗</p>";

        return false;
    }
}

/* =========================
   画像先読み
========================= */

async function preloadAllImages(){

    let loadedCount = 0;

    await Promise.all(

        photoList.map(file => {

            return new Promise(resolve => {

                const img =
                    new Image();

                img.src =
                    file.download_url;

                const finish = () => {

                    loadedCount++;

                    const percent =
                        Math.round(
                            loadedCount /
                            photoList.length *
                            100
                        );

                    loaderCounter.textContent =
                        `${percent}%`;

                    resolve();

                };

                img.onload =
                    finish;

                img.onerror =
                    finish;

            });

        })

    );

}

/* =========================
   ソート
========================= */

function sortPhotos(){

    if(newestFirst){

        photoList.sort(
            (a,b) =>
            b.name.localeCompare(
                a.name
            )
        );

        sortButton.textContent =
            "古い順";

    }else{

        photoList.sort(
            (a,b) =>
            a.name.localeCompare(
                b.name
            )
        );

        sortButton.textContent =
            "新しい順";

    }

    renderGallery();

}

/* =========================
   画像一覧生成
========================= */
function renderGallery(){

    gallery.innerHTML = "";

    photoList.forEach(
        (file,index) => {

            const box =
                document.createElement(
                    "div"
                );

            box.className =
                "photo-box";

            /* 出現前状態 */

            box.style.opacity = "0";

            box.style.transform =
                "translateY(20px)";

            const img =
                document.createElement(
                    "img"
                );

            img.src =
                file.download_url;

            box.appendChild(
                img
            );

            box.onclick =
                () => {

                    currentIndex =
                        index;

                    openLightbox(
                        index
                    );

                };

            gallery.appendChild(
                box
            );

            /* 順番に表示 */

            setTimeout(() => {

                box.style.transition =
                    "opacity .6s ease, transform .6s ease";

                box.style.opacity =
                    "1";

                box.style.transform =
                    "translateY(0)";

            }, index * 30);

        }
    );

}


/* =========================
   ライトボックス
========================= */

function openLightbox(index){

    lightboxImage.src =
        photoList[index]
        .download_url;

    updateCounter();

    lightbox.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";

}

function closeLightbox(){

    lightbox.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";

}

function updateCounter(){

    imageCounter.textContent =
        `${currentIndex + 1} / ${photoList.length}`;

}

/* =========================
   アニメーション
========================= */

function animateImage(direction){

    lightboxImage.classList.remove(
        "slide-left",
        "slide-right"
    );

    void lightboxImage.offsetWidth;

    lightboxImage.classList.add(
        direction
    );

}

/* =========================
   前後移動
========================= */

function nextPhoto(){

    currentIndex++;

    if(
        currentIndex >=
        photoList.length
    ){
        currentIndex = 0;
    }

    lightboxImage.src =
        photoList[currentIndex]
        .download_url;

    updateCounter();

    animateImage(
        "slide-left"
    );

}

function prevPhoto(){

    currentIndex--;

    if(
        currentIndex < 0
    ){
        currentIndex =
            photoList.length - 1;
    }

    lightboxImage.src =
        photoList[currentIndex]
        .download_url;

    updateCounter();

    animateImage(
        "slide-right"
    );

}

/* =========================
   イベント
========================= */

nextBtn.onclick =
    nextPhoto;

prevBtn.onclick =
    prevPhoto;

lightboxClose.onclick =
    closeLightbox;

sortButton.onclick =
    () => {

        newestFirst =
            !newestFirst;

        sortPhotos();

    };

lightbox.addEventListener(
    "click",
    e => {

        if(
            e.target ===
            lightbox
        ){
            closeLightbox();
        }

    }
);

document.addEventListener(
    "keydown",
    e => {

        if(
            !lightbox.classList.contains(
                "active"
            )
        ){
            return;
        }

        if(
            e.key ===
            "ArrowRight"
        ){
            nextPhoto();
        }

        if(
            e.key ===
            "ArrowLeft"
        ){
            prevPhoto();
        }

        if(
            e.key ===
            "Escape"
        ){
            closeLightbox();
        }

    }
);

/* =========================
   フリック
========================= */

lightbox.addEventListener(
    "touchstart",
    e => {

        touchStartX =
            e.changedTouches[0]
            .screenX;

    }
);

lightbox.addEventListener(
    "touchend",
    e => {

        const diff =
            e.changedTouches[0]
            .screenX
            -
            touchStartX;

        if(diff > 50){

            prevPhoto();

        }else if(
            diff < -50
        ){

            nextPhoto();

        }

    }
);

/* =========================
   シャボン玉
========================= */

function createBubble(){

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    const size =
        Math.random() * 80 + 20;

    bubble.style.width =
        `${size}px`;

    bubble.style.height =
        `${size}px`;

    bubble.style.left =
        `${Math.random()*100}%`;

    const colors = [

        "rgba(255,120,255,.4)",
        "rgba(180,120,255,.35)",
        "rgba(255,80,180,.35)",
        "rgba(200,100,255,.4)"

    ];

    const color =
        colors[
            Math.floor(
                Math.random() *
                colors.length
            )
        ];

    bubble.style.background =
        `radial-gradient(
            circle at 30% 30%,
            rgba(255,255,255,.8),
            ${color}
        )`;

    bubble.style.boxShadow =
        `
        0 0 20px ${color},
        0 0 40px ${color}
        `;

    bubble.style.setProperty(
        "--drift",
        `${Math.random()*200-100}px`
    );

    bubble.style.animationDuration =
        `${12 + Math.random()*12}s`;

    bubbleArea.appendChild(
        bubble
    );

    bubble.addEventListener(
        "animationend",
        () => bubble.remove()
    );

}

setInterval(
    createBubble,
    800
);

/* =========================
   起動
========================= */
loadPhotos().then(success => {

    if(success){

        setTimeout(() => {

            loader.classList.add(
                "hidden"
            );

            document.body.classList.remove(
                "loading"
            );

            document.body.classList.add(
                "loaded"
            );

        },1000);

    }

});</script>
            
        
    </body>
