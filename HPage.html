<!DOCTYPE html>
<html>
<head>
                <style>*{
    box-sizing:border-box;
}

body{

    margin:0;

    background:
        radial-gradient(
            circle at top,
            #0c0012,
            #440130
        );

    color:#ddd;
}

p{
    text-align:center;
    padding:20px 10px;
    font-size:32px;
    letter-spacing:4px;
    color:#cfcfcf;
    text-shadow:0 0 10px #8800ff;
}

.gallery{
    width:90%;
    max-width:1200px;
    margin:0 auto 50px;

    display:grid;
    grid-template-columns:
        repeat(auto-fill,minmax(260px,1fr));

    gap:20px;
}

.photo-box{
    position:relative;
    height:260px;

    overflow:hidden;

    border:2px solid #222;
    background:#000;

    cursor:pointer;

    box-shadow:
        0 0 15px rgba(120,0,255,.4);

    transition:.3s;
}

.photo-box:hover{
    transform:scale(1.03);

    box-shadow:
        0 0 25px rgba(180,0,255,.7);
}

.photo-box img{
    width:100%;
    height:100%;

    object-fit:cover;

    filter:
        brightness(70%)
        contrast(120%)
        saturate(130%);

    transition:.4s;
}

.photo-box:hover img{
    filter:
        brightness(100%)
        contrast(140%)
        saturate(150%);
}

.caption{
    position:absolute;
    left:0;
    bottom:0;

    width:100%;
    padding:8px;

    background:rgba(0,0,0,.6);

    text-align:center;
    font-size:12px;

    opacity:0;

    transition:.3s;
}

.photo-box:hover .caption{
    opacity:1;
}

.lightbox{
    padding:80px;
    position:fixed;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    background:rgba(0,0,0,.95);

    opacity:0;
    visibility:hidden;

    transition:.3s;

    z-index:9999;
}

.lightbox.active{
    opacity:1;
    visibility:visible;
}

.lightbox img{
    max-width:95vw;
    max-height:90vh;

    object-fit:contain;

    transform:scale(.9);

    transition:.3s;
}

.lightbox.active img{
    transform:scale(1);
}

.lightbox-close{
    position:fixed;

    top:15px;
    right:20px;

    width:50px;
    height:50px;

    display:flex;
    justify-content:center;
    align-items:center;

    border-radius:50%;

    color:#fff;

    font-size:40px;

    background:rgba(0,0,0,.7);

    cursor:pointer;
}

@media(max-width:600px){

    p{
        font-size:20px;
    }

    .gallery{
        width:95%;
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    .photo-box{
        height:180px;
    }

    .caption{
        opacity:1;
        font-size:10px;
    }
}
.nav-btn{

    position:fixed;

    top:50%;

    transform:translateY(-50%);

    width:60px;
    height:60px;

    border:none;

    border-radius:50%;

    background:rgba(0,0,0,.7);

    color:white;

    font-size:32px;

    cursor:pointer;

    z-index:10000;

    transition:.2s;
}

.nav-btn:hover{

    background:rgba(140,0,255,.8);

}

.prev-btn{

    left:20px;

}

.next-btn{

    right:20px;

}

@media(max-width:600px){

    .nav-btn{

        width:50px;
        height:50px;

        font-size:24px;
    }

    .prev-btn{

        left:10px;

    }

    .next-btn{

        right:10px;

    }

}
.slide-left{
    animation:slideLeft .25s ease;
}

.slide-right{
    animation:slideRight .25s ease;
}

@keyframes slideLeft{

    from{
        opacity:0;
        transform:
            translateX(60px)
            scale(.95);
    }

    to{
        opacity:1;
        transform:
            translateX(0)
            scale(1);
    }

}

@keyframes slideRight{

    from{
        opacity:0;
        transform:
            translateX(-60px)
            scale(.95);
    }

    to{
        opacity:1;
        transform:
            translateX(0)
            scale(1);
    }

}

#bubbles{

    position:fixed;

    inset:0;

    overflow:hidden;

    pointer-events:none;

    z-index:-1;
}

.bubble{

    position:absolute;

    bottom:-120px;

    border-radius:50%;

    opacity:.25;

    filter:blur(2px);

    animation:
        floatUp linear forwards;
}

@keyframes floatUp{

    0%{

        transform:
            translateY(0)
            translateX(0)
            scale(.8);

        opacity:0;
    }

    15%{

        opacity:.35;
    }

    70%{

        opacity:.25;
    }

    100%{

        transform:
            translateY(-120vh)
            translateX(var(--drift))
            scale(1.2);

        opacity:0;
    }
}
.sort-button{

    position:fixed;

    top:15px;
    left:15px;

    z-index:1000;

    border:none;

    padding:10px 16px;

    border-radius:999px;

    cursor:pointer;

    color:white;

    background:
        rgba(120,0,255,.7);

    backdrop-filter:blur(8px);

    box-shadow:
        0 0 15px rgba(160,0,255,.6);

    transition:.3s;
}

.sort-button:hover{

    transform:scale(1.05);

    background:
        rgba(180,0,255,.85);
}
.loader{

    position:fixed;
    inset:0;

    display:flex;
    flex-direction:column;

    justify-content:center;
    align-items:center;

    background:
        radial-gradient(
            circle at top,
            #0c0012,
            #9d0770
        );

    z-index:999999;

    transition:.8s ease;
}

.loader.hidden{

    opacity:0;

    visibility:hidden;
}

.loader-heart{

    font-size:72px;

    color:#ff6cf5;

    text-shadow:
        0 0 20px #ff6cf5,
        0 0 40px #ae62ff;

    animation:
        heartbeat 1.5s infinite;
}

.loader-text{

    margin-top:20px;

    letter-spacing:4px;

    color:white;
}

@keyframes heartbeat{

    0%{
        transform:scale(1);
    }

    30%{
        transform:scale(1.15);
    }

    50%{
        transform:scale(.95);
    }

    100%{
        transform:scale(1);
    }

}</style>

                <script>(function installLiveweaveConsoleBridge() {
        if (window.__liveweaveConsoleBridge) return;
        window.__liveweaveConsoleBridge = true;

        function format(value) {
            if (typeof value === 'string') return value;
            if (typeof value === 'undefined') return 'undefined';
            if (typeof value === 'function') return value.toString();
            if (value instanceof Error) return value.name + ': ' + value.message;
            if (value instanceof Element) return value.outerHTML;
            try {
                var seen = [];
                return JSON.stringify(value, function(key, item) {
                    if (typeof item === 'object' && item !== null) {
                        if (seen.indexOf(item) !== -1) return '[Circular]';
                        seen.push(item);
                    }
                    return item;
                }, 2);
            } catch (err) {
                return String(value);
            }
        }

        function send(type, values, id) {
            parent.postMessage({
                source: 'liveweave-preview-console',
                type: type,
                id: id || '',
                values: (values || []).map(format)
            }, '*');
        }

        ['log', 'info', 'warn', 'error', 'debug'].forEach(function(level) {
            var original = console[level];
            console[level] = function() {
                var args = Array.prototype.slice.call(arguments);
                send(level === 'log' || level === 'debug' ? 'log' : level, args);
                if (original) original.apply(console, args);
            };
        });

        window.addEventListener('error', function(event) {
            send('error', [event.message + (event.lineno ? ' (line ' + event.lineno + ')' : '')]);
        });
        window.addEventListener('unhandledrejection', function(event) {
            send('error', ['Unhandled promise rejection:', event.reason]);
        });
        window.addEventListener('message', function(event) {
            var message = event.data || {};
            if (event.source !== parent || message.source !== 'liveweave-parent-console' || message.type !== 'evaluate') return;
            try {
                var result = (0, eval)(message.code);
                Promise.resolve(result).then(function(value) {
                    send('result', [value], message.id);
                }, function(error) {
                    send('error', [error], message.id);
                });
            } catch (error) {
                send('error', [error], message.id);
            }
        });
        send('ready', []);
    })();</script>
                <script>(function installPreviewLinkGuard() {
        var noticeTimer;

        function showNotice(message) {
            var notice = document.getElementById('lw-preview-link-notice');
            if (!notice) {
                notice = document.createElement('div');
                notice.id = 'lw-preview-link-notice';
                notice.setAttribute('role', 'status');
                notice.style.cssText = 'position:fixed;left:12px;bottom:12px;z-index:2147483647;max-width:calc(100% - 24px);padding:10px 14px;border-radius:9px;background:#17212d;color:#fff;font:13px/1.4 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.25);pointer-events:none;';
                document.body.appendChild(notice);
            }
            notice.textContent = message;
            notice.hidden = false;
            clearTimeout(noticeTimer);
            noticeTimer = setTimeout(function() { notice.hidden = true; }, 3500);
        }

        document.addEventListener('click', function(event) {
            var link = event.target.closest && event.target.closest('a[href]');
            if (!link || event.defaultPrevented) return;

            var href = (link.getAttribute('href') || '').trim();
            if (href.charAt(0) === '#') {
                event.preventDefault();
                var fragment = href.slice(1);
                if (!fragment) {
                    window.scrollTo(0, 0);
                    return;
                }
                try { fragment = decodeURIComponent(fragment); } catch (error) {}
                var target = document.getElementById(fragment) || document.getElementsByName(fragment)[0];
                if (target) target.scrollIntoView();
                return;
            }

            if (/^(https?:)?\/\//i.test(href)) {
                event.preventDefault();
                window.open(href, '_blank', 'noopener,noreferrer');
                return;
            }

            if (/^(mailto:|tel:)/i.test(href)) return;

            event.preventDefault();
            showNotice('This page cannot be opened in the preview.');
        }, true);
    })();</script>

        console.error(err);

        gallery.innerHTML =
            "<p>画像取得失敗</p>";

        return false;
    }
}
function sortPhotos() {

    if(newestFirst){

        photoList.sort(
            (a,b)=>
            b.name.localeCompare(a.name)
        );

        sortButton.textContent =
            "新しい順";

    }else{

        photoList.sort(
            (a,b)=>
            a.name.localeCompare(b.name)
        );

        sortButton.textContent =
            "古い順";
    }

    renderGallery();
}

function renderGallery() {

    gallery.innerHTML = "";

    photoList.forEach(
        (file,index) => {

            const box =
                document.createElement("div");

            box.className =
                "photo-box";

            const img =
                document.createElement("img");

            img.src =
                file.download_url;

            img.loading =
                "lazy";

            box.append(
                img
            );

            box.onclick = () => {

                currentIndex =
                    index;

                openLightbox(
                    index
                );
            };

            gallery.appendChild(box);
        }
    );
}

function openLightbox(index){

    lightboxImage.src =
        photoList[index]
        .download_url;

    lightbox.classList.add(
        "active"
    );

    document.body.style.overflow =
        "hidden";
}

function closeLightbox(){

    lightbox.classList.remove(
        "active"
    );

    document.body.style.overflow =
        "";
}

function animateImage(direction){

    lightboxImage.classList.remove(
        "slide-left",
        "slide-right"
    );

    void lightboxImage.offsetWidth;

    lightboxImage.classList.add(
        direction
    );
}

function nextPhoto(){

    currentIndex++;

    if(
        currentIndex >=
        photoList.length
    ){
        currentIndex = 0;
    }

    lightboxImage.src =
        photoList[currentIndex]
        .download_url;

    animateImage(
        "slide-left"
    );
}

function prevPhoto(){

    currentIndex--;

    if(currentIndex < 0){

        currentIndex =
            photoList.length - 1;
    }

    lightboxImage.src =
        photoList[currentIndex]
        .download_url;

    animateImage(
        "slide-right"
    );
}

nextBtn.onclick =
    nextPhoto;

prevBtn.onclick =
    prevPhoto;

lightboxClose.onclick =
    closeLightbox;

sortButton.onclick = () => {

    newestFirst =
        !newestFirst;

    sortPhotos();
};

document.addEventListener(
    "keydown",
    e => {

        if(
            !lightbox.classList.contains(
                "active"
            )
        ){
            return;
        }

        if(
            e.key ===
            "ArrowRight"
        ){
            nextPhoto();
        }

        if(
            e.key ===
            "ArrowLeft"
        ){
            prevPhoto();
        }

        if(
            e.key ===
            "Escape"
        ){
            closeLightbox();
        }
    }
);

lightbox.addEventListener(
    "touchstart",
    e => {

        touchStartX =
            e.changedTouches[0]
            .screenX;
    }
);

lightbox.addEventListener(
    "touchend",
    e => {

        const diff =
            e.changedTouches[0]
            .screenX
            -
            touchStartX;

        if(diff > 50){

            prevPhoto();

        }else if(
            diff < -50
        ){

            nextPhoto();
        }
    }
);

const bubbleArea =
    document.getElementById(
        "bubbles"
    );

function createBubble(){

    const bubble =
        document.createElement(
            "div"
        );

    bubble.className =
        "bubble";

    bubbleArea.appendChild(
        bubble
    );

    bubble.addEventListener(
        "animationend",
        () => bubble.remove()
    );
}

setInterval(
    createBubble,
    800
);
lightbox.addEventListener(
    "click",
    e => {

        if(
            e.target === lightbox
        ){
            closeLightbox();
        }

    }
);
loadPhotos().then(() => {

    setTimeout(() => {

        loader.classList.add(
            "hidden"
        );

    },400);

});</script>
